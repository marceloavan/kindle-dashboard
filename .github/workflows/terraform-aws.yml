name: Terraform plan

# Plans infra/aws on pull-request changes. Applies are a separate workflow
# (/apply comment). Auth is GitHub OIDC into the plan role reused from the
# workhours-manager repo (see infra/aws/README.md).

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'infra/aws/**'
      - '.github/workflows/terraform-aws.yml'
      - '.github/workflows/terraform-aws-apply.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode OIDC subject (diagnostic)
        run: |
          jwt=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H "Accept: application/json; api-version=2.0" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$jwt" | cut -d. -f2 | python3 -c "import sys,base64,json; s=sys.stdin.read().strip(); s+='='*(-len(s)%4); print(json.dumps(json.loads(base64.urlsafe_b64decode(s)), indent=1))"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.6"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::041364215703:role/whours-github-actions-terraform-plan
          aws-region: us-east-1

      - name: Terraform init
        working-directory: infra/aws
        run: terraform init

      - name: Terraform plan
        working-directory: infra/aws
        env:
          # The real GitHub token is an environment secret used only at
          # apply time; planning only needs a non-empty placeholder.
          TF_VAR_github_token: plan-only-placeholder-value
        run: terraform plan -no-color -input=false -out=tfplan
