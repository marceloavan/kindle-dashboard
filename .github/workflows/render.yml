name: Render dashboard

on:
  schedule:
    # Every 15 minutes during the day, in Brasília time (UTC-3):
    # UTC 10:00–23:59 + 00:00–01:45 ≈ BRT 07:00–22:45.
    # GitHub runs schedules best-effort (observed ~2-3x/day on this repo).
    - cron: "*/15 10-23,0-1 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Render dashboard
        env:
          # Defaults to America/Sao_Paulo in code; override via repo Settings
          # > Secrets and variables > Actions > Variables (non-secret).
          DASH_TZ: ${{ vars.DASH_TZ || 'America/Sao_Paulo' }}
        run: go run . --out site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
