name: Render dashboard

on:
  schedule:
    # Every 15 minutes. GitHub schedules in UTC and may delay runs.
    # Note: scheduled workflows only run on the default branch and pause
    # after ~60 days of repository inactivity.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Render dashboard
        env:
          # Defaults to America/Sao_Paulo in code; override via repo Settings
          # > Secrets and variables > Actions > Variables (non-secret).
          DASH_TZ: ${{ vars.DASH_TZ || 'America/Sao_Paulo' }}
        run: go run . --out site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
